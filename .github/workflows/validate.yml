name: Validate

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Validate repository
        run: python3 scripts/validate.py
      - name: Verify generated evaluation inventory
        run: python3 scripts/build_evals.py --check
      - name: Run negative-fixture tests
        run: python3 -m unittest discover -s tests -v
      - name: Reproduce install artifacts
        run: |
          mkdir -p /tmp/strategic-advisor-build-a /tmp/strategic-advisor-build-b
          python3 scripts/build_install_artifacts.py build --license LICENSE --skill-archive /tmp/strategic-advisor-build-a/strategic-advisor.zip --plugin-archive /tmp/strategic-advisor-build-a/strategic-advisor-plugin.zip --chatgpt-kit /tmp/strategic-advisor-build-a/strategic-advisor-chatgpt.zip --provenance-out /tmp/strategic-advisor-build-a/install-artifacts.json
          python3 scripts/build_install_artifacts.py build --license LICENSE --skill-archive /tmp/strategic-advisor-build-b/strategic-advisor.zip --plugin-archive /tmp/strategic-advisor-build-b/strategic-advisor-plugin.zip --chatgpt-kit /tmp/strategic-advisor-build-b/strategic-advisor-chatgpt.zip --provenance-out /tmp/strategic-advisor-build-b/install-artifacts.json
          python3 scripts/build_install_artifacts.py verify --skill-archive /tmp/strategic-advisor-build-a/strategic-advisor.zip --plugin-archive /tmp/strategic-advisor-build-a/strategic-advisor-plugin.zip --chatgpt-kit /tmp/strategic-advisor-build-a/strategic-advisor-chatgpt.zip --provenance /tmp/strategic-advisor-build-a/install-artifacts.json
          python3 scripts/build_install_artifacts.py verify --skill-archive /tmp/strategic-advisor-build-b/strategic-advisor.zip --plugin-archive /tmp/strategic-advisor-build-b/strategic-advisor-plugin.zip --chatgpt-kit /tmp/strategic-advisor-build-b/strategic-advisor-chatgpt.zip --provenance /tmp/strategic-advisor-build-b/install-artifacts.json
          cmp /tmp/strategic-advisor-build-a/strategic-advisor.zip /tmp/strategic-advisor-build-b/strategic-advisor.zip
          cmp /tmp/strategic-advisor-build-a/strategic-advisor-plugin.zip /tmp/strategic-advisor-build-b/strategic-advisor-plugin.zip
          cmp /tmp/strategic-advisor-build-a/strategic-advisor-chatgpt.zip /tmp/strategic-advisor-build-b/strategic-advisor-chatgpt.zip
          cmp /tmp/strategic-advisor-build-a/install-artifacts.json /tmp/strategic-advisor-build-b/install-artifacts.json
